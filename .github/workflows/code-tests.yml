name: Code and processed-display contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts src tests reproduce.py verify_current.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_display.py --validate-only
      - run: python scripts/build_display_tables.py --output-dir outputs/tables-ci
  display-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce_display.py --output-dir outputs/display-ci
      # Export receipts prove display execution; original models are not rerun.
